[project]
name = "askmydocs"
version = "0.1.0"
description = "Domain-specific RAG, grounding & evaluation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",

    # Schemas & config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Storage
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.10",

    # ML (embeddings + reranker)
    "sentence-transformers>=3.0",
    "torch>=2.2",

    # LLM (OpenRouter via OpenAI-compatible client)
    "openai>=1.40",

    # Document parsing
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdown>=3.6",

    # Observability
    "langfuse>=2.42",

    # Evaluation
    "ragas>=0.2.11",
    "numpy>=1.26",
    "pandas>=2.2",

    # Utility
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "tiktoken>=0.7",
    # Loads evals/thresholds.yaml, the single source of truth for regression gates.
    "PyYAML>=6.0",

    # Background tasks (ingestion/eval workers; local Redis via compose).
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests>=2.31",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S101", "SIM"]
ignore = [
    "S101",  # assert in tests is fine
]

# Longer lines are acceptable in the content-authoring scripts and the
# renderers, where density otherwise hurt readability.
[tool.ruff.lint.per-file-ignores]
"scripts/generate_corpus.py" = ["E501"]
"scripts/pdf_docx_render.py" = ["E501"]
"scripts/resolve_relevant_chunks.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 60

markers = [
    "unit: Unit tests that run without external services (no DB, Docker, network, or model downloads).",
    "integration: Integration tests that connect multiple internal components.",
    "evaluation: Evaluation and benchmark tests.",
    "requires_docker: Tests that require Docker containers (Postgres, Qdrant).",
    "requires_network: Tests that require network access to external services.",
    "slow: Tests that take longer than 5 seconds to run.",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "app/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
