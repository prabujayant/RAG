# AskMyDocs PRODUCTION stack (Oracle Always Free ARM VM).
# Self-contained on purpose: local `docker-compose.yml` keeps public ports for
# dev; this file exposes ONLY Caddy (80/443). DBs talk over the compose
# network via service names. Volumes are shared by name, so switching files
# never deletes data.
#
# Usage on the VM:
#   cp .env.example .env   # then set OPENROUTER_API_KEY, API_DOMAIN, CORS_ORIGINS
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Local dev is unaffected: keep using `docker compose up -d` + `make run`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: askmydocs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askmydocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askmydocs}
      POSTGRES_DB: ${POSTGRES_DB:-askmydocs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askmydocs} -d ${POSTGRES_DB:-askmydocs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: askmydocs-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: askmydocs-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: askmydocs-api
    env_file:
      - .env
    environment:
      # Service-name URLs win over any localhost values in .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-askmydocs}:${POSTGRES_PASSWORD:-askmydocs}@postgres:5432/${POSTGRES_DB:-askmydocs}
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: production
    volumes:
      - uploads_data:/srv/app/data/uploads
      - models_cache:/models
      # The image ships only app/ + scripts/ (no data/), so the corpus is
      # bind-mounted read-only. DEPLOY.md step 8 ingests from this path.
      - ./data/corpus:/srv/app/data/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  worker:
    build: .
    container_name: askmydocs-worker
    command: ["python", "-m", "celery", "-A", "app.celery_app", "worker", "--queues", "ingestion,evaluation,benchmark", "-l", "info", "--concurrency", "1", "--prefetch-multiplier", "1"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-askmydocs}:${POSTGRES_PASSWORD:-askmydocs}@postgres:5432/${POSTGRES_DB:-askmydocs}
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: production
    volumes:
      - uploads_data:/srv/app/data/uploads
      - models_cache:/models
      # The worker performs ingestion, so it needs the corpus too.
      - ./data/corpus:/srv/app/data/corpus:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: askmydocs-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  uploads_data:
  models_cache:
  caddy_data:
  caddy_config:
