# =============================================================================
# CI/CD workflow — runs on every PR and push to main.
#
# Stages: lint → typecheck → unit tests → integration tests → evaluation tests
#         → docker build → deploy (main only, gated)
#
# The `deploy` stage only runs on a push to main, only when the HF_TOKEN secret
# is configured, and only after every test + the image build succeed. It is
# additionally gated behind the `production` GitHub Environment, so it can be
# held for manual approval. PRs from forks never reach it.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same PR; allow main branch runs to proceed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  # Paths for coverage and test artifacts
  COVERAGE_XML: coverage.xml
  PYTEST_REPORT: pytest-report.xml

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Environment & dependency installation
  # --------------------------------------------------------------------------
  setup:
    # NOTE: `env` is NOT available in a job name; use a literal.
    name: Setup Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache uv store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          # NOTE: the real package is `pytest-github-actions-annotate-failures`.
          # `pytest-github-actions-verbose-output` was a typo that has never
          # existed on PyPI, so this step failed and took down every CI job
          # (lint, typecheck, unit tests) — which in turn blocked the deploy
          # stage, since it `needs` the test jobs.
          pip install pytest pytest-asyncio pytest-cov pytest-timeout pytest-github-actions-annotate-failures

      - name: Verify installation
        run: pip show ruff mypy pytest

  # --------------------------------------------------------------------------
  # Stage 2: Linting (ruff check + format)
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache uv store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check app tests scripts

      - name: Check ruff format
        run: ruff format --check app tests scripts

  # --------------------------------------------------------------------------
  # Stage 3: Static type checking (mypy)
  # --------------------------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy app

  # --------------------------------------------------------------------------
  # Stage 4: Unit tests
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}
          restore-keys: hf-models-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m unit --cov=app --cov-report=xml --cov-report=term-missing --junitxml=${{ env.PYTEST_REPORT }} -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: ${{ env.COVERAGE_XML }}
          retention-days: 7

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-unit
          path: ${{ env.PYTEST_REPORT }}
          retention-days: 7

      - name: Check minimum coverage thresholds
        run: |
          pip install coverage
          coverage report --fail-under=70 --precision=2

  # --------------------------------------------------------------------------
  # Stage 5: Integration tests (requires service containers)
  # --------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: askmydocs
          POSTGRES_PASSWORD: askmydocs
          POSTGRES_DB: askmydocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          python -c "
          import socket, time
          for i in range(30):
              try:
                  s = socket.create_connection(('127.0.0.1', 5432), timeout=1)
                  s.close()
                  print('PostgreSQL ready')
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('PostgreSQL not ready')
          "

      - name: Run integration tests
        run: pytest -m integration --junitxml=${{ env.PYTEST_REPORT }} -v --tb=short

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-integration
          path: ${{ env.PYTEST_REPORT }}
          retention-days: 7

  # --------------------------------------------------------------------------
  # Stage 6: Evaluation tests (mock mode — no external API calls)
  # --------------------------------------------------------------------------
  evaluation-tests:
    name: Evaluation tests (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Dataset validation scripts run before evaluation tests
      - name: Validate golden dataset
        run: python scripts/validate_dataset.py

      - name: Check chunk references
        run: python scripts/check_chunk_refs.py

      - name: Run evaluation tests (mock mode)
        run: pytest -m evaluation --junitxml=${{ env.PYTEST_REPORT }} -v --tb=short

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-evaluation
          path: ${{ env.PYTEST_REPORT }}
          retention-days: 7

  # --------------------------------------------------------------------------
  # Stage 7: Docker build (validates the production image actually builds)
  # --------------------------------------------------------------------------
  # Build-only: nothing is pushed to a registry. This catches Dockerfile
  # regressions (missing COPY targets, broken deps) that unit tests cannot.
  docker-build:
    name: Docker build
    needs: [lint, typecheck, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: askmydocs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint python askmydocs:ci -c "
          import app.main
          print('app.main imports OK')
          "

  # --------------------------------------------------------------------------
  # Stage 8: Deploy to Hugging Face Spaces (main branch only, gated)
  # --------------------------------------------------------------------------
  # Guarded three ways:
  #   1. `if:` — only on a push to main, never on PRs or forks.
  #   2. `environment: production` — can require manual approval in repo settings.
  #   3. The HF_TOKEN secret must exist; the step is skipped without it.
  #
  # `needs` deliberately EXCLUDES `evaluation-tests`. Evaluation quality is not
  # a runtime-correctness gate, and a metrics-library bump should never be able
  # to take the live site down. Evals still run in this same workflow and still
  # gate the `all-tests-pass` aggregate (and therefore branch protection).
  #
  # NOTE: this restarts the Space. With INGEST_CORPUS=false the corpus is not
  # re-ingested, and uploaded documents live in the Space's persistent storage,
  # so they survive a redeploy. Verify before enabling auto-deploy.
  deploy:
    name: Deploy to HF Spaces
    needs: [docker-build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check for HF_TOKEN
        id: guard
        run: |
          if [ -n "${{ secrets.HF_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN not configured — skipping deploy."
          fi

      - name: Set up Python
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install staging dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: pip install huggingface_hub

      - name: Stage and push to Space
        if: steps.guard.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/hf_space_stage.py --push Prabu17/askmydocs

      # A successful upload is NOT a successful deploy. The push only commits
      # files; HF then builds remotely, and a build can still fail (e.g. the
      # exit-137 OOM that took the Space down three times in Sept 2026). Without
      # this poll, that failure is invisible in CI and the site is simply down.
      - name: Wait for Space build and verify it serves
        if: steps.guard.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: Prabu17/askmydocs
          SPACE_URL: https://prabu17-askmydocs.hf.space
        run: |
          set -euo pipefail
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os, time
          from huggingface_hub import HfApi

          space = os.environ["SPACE_ID"]
          token = os.environ.get("HF_TOKEN") or None
          api = HfApi(token=token)

          deadline = time.time() + 45 * 60
          stage = "unknown"
          while time.time() < deadline:
              stage = api.space_info(space).runtime.stage
              print(f"stage={stage}", flush=True)
              if stage in ("RUNNING", "BUILD_ERROR", "RUNTIME_ERROR"):
                  break
              time.sleep(30)
          else:
              raise SystemExit(f"timed out waiting for {space} (last stage={stage})")

          if stage != "RUNNING":
              raise SystemExit(
                  f"{space} did not reach RUNNING (stage={stage}). "
                  "Check the build logs on the Space page."
              )
          print(f"{space} is RUNNING")
          PY

          # APP_STARTING can still briefly 502 behind the HF proxy, so retry
          # the health check for a few minutes before failing the job.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
                   "${SPACE_URL}/health" || true)
            echo "health attempt ${i}: ${code}"
            if [ "$code" = "200" ]; then
              echo "Space is serving"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Space reached RUNNING but /health never returned 200"
          exit 1

  # --------------------------------------------------------------------------
  # Stage 9: All tests pass gate
  # --------------------------------------------------------------------------
  # This job simply depends on all test jobs and always passes.
  # GitHub branch protection rules should require this job to pass.
  all-tests-pass:
    name: All tests passed
    needs: [lint, typecheck, unit-tests, integration-tests, evaluation-tests, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks succeeded
        run: echo "All CI checks passed."
