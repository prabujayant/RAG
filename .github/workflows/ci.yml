# =============================================================================
# CI workflow — runs on every PR and push to main.
# Stages: lint → typecheck → unit tests → integration tests → evaluation tests
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same PR; allow main branch runs to proceed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  # Paths for coverage and test artifacts
  COVERAGE_XML: coverage.xml
  PYTEST_REPORT: pytest-report.xml

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Environment & dependency installation
  # --------------------------------------------------------------------------
  setup:
    # NOTE: `env` is NOT available in a job name; use a literal.
    name: Setup Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache uv store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-cov pytest-timeout pytest-github-actions-verbose-output

      - name: Verify installation
        run: pip show ruff mypy pytest

  # --------------------------------------------------------------------------
  # Stage 2: Linting (ruff check + format)
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache uv store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check app tests scripts

      - name: Check ruff format
        run: ruff format --check app tests scripts

  # --------------------------------------------------------------------------
  # Stage 3: Static type checking (mypy)
  # --------------------------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy app

  # --------------------------------------------------------------------------
  # Stage 4: Unit tests
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}
          restore-keys: hf-models-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m unit --cov=app --cov-report=xml --cov-report=term-missing --junitxml=${{ env.PYTEST_REPORT }} -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: ${{ env.COVERAGE_XML }}
          retention-days: 7

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-unit
          path: ${{ env.PYTEST_REPORT }}
          retention-days: 7

      - name: Check minimum coverage thresholds
        run: |
          pip install coverage
          coverage report --fail-under=70 --precision=2

  # --------------------------------------------------------------------------
  # Stage 5: Integration tests (requires service containers)
  # --------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: askmydocs
          POSTGRES_PASSWORD: askmydocs
          POSTGRES_DB: askmydocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          python -c "
          import socket, time
          for i in range(30):
              try:
                  s = socket.create_connection(('127.0.0.1', 5432), timeout=1)
                  s.close()
                  print('PostgreSQL ready')
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('PostgreSQL not ready')
          "

      - name: Run integration tests
        run: pytest -m integration --junitxml=${{ env.PYTEST_REPORT }} -v --tb=short

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-integration
          path: ${{ env.PYTEST_REPORT }}
          retention-days: 7

  # --------------------------------------------------------------------------
  # Stage 6: Evaluation tests (mock mode — no external API calls)
  # --------------------------------------------------------------------------
  evaluation-tests:
    name: Evaluation tests (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Dataset validation scripts run before evaluation tests
      - name: Validate golden dataset
        run: python scripts/validate_dataset.py

      - name: Check chunk references
        run: python scripts/check_chunk_refs.py

      - name: Run evaluation tests (mock mode)
        run: pytest -m evaluation --junitxml=${{ env.PYTEST_REPORT }} -v --tb=short

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-evaluation
          path: ${{ env.PYTEST_REPORT }}
          retention-days: 7

  # --------------------------------------------------------------------------
  # Stage 7: All tests pass gate
  # --------------------------------------------------------------------------
  # This job simply depends on all test jobs and always passes.
  # GitHub branch protection rules should require this job to pass.
  all-tests-pass:
    name: All tests passed
    needs: [lint, typecheck, unit-tests, integration-tests, evaluation-tests]
    runs-on: ubuntu-latest
    steps:
      - name: All checks succeeded
        run: echo "All CI checks passed."
