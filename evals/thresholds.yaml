# Single source of truth for evaluation thresholds.
#
# Loaded by app/evaluation/regression.py:load_thresholds(). Do not duplicate these
# values in Python — DEFAULT_THRESHOLDS there is only a fallback for the case where
# this file is missing, and tests/unit/test_regression.py asserts the two stay in sync.
#
# Each entry: metric name, absolute minimum, and relative tolerance (fraction).
# A metric regresses if: current < minimum OR (drop > tolerance AND not an improvement).
#
# These minimums are *achievable floors*, not aspirations: they sit just below the
# values recorded in evals/baselines/baseline.json so the gate catches real
# regressions instead of failing permanently. Raise them deliberately when a new
# baseline is actually achieved (see `make baseline-update`).

# RAGAs evaluation metrics
ragas:
  answer_correctness:
    minimum: 0.50
    tolerance: 0.10   # 10% relative tolerance

  answer_relevancy:
    minimum: 0.60
    tolerance: 0.10

  context_precision:
    minimum: 0.50
    tolerance: 0.10

  context_recall:
    minimum: 0.50
    tolerance: 0.10

  faithfulness:
    minimum: 0.55
    tolerance: 0.10

# Retrieval metrics
retrieval:
  hit_rate:
    minimum: 0.60
    tolerance: 0.05   # 5% tolerance — more stringent for retrieval

  mrr:
    minimum: 0.45
    tolerance: 0.05

  recall_at_k:
    minimum: 0.55
    tolerance: 0.05

  precision_at_k:
    minimum: 0.25
    tolerance: 0.05

  ndcg_at_k:
    minimum: 0.40
    tolerance: 0.05

# Citation metrics
# NOTE: the emitted metric is `citation_completeness` (see app/evaluation/citation_metrics.py).
# An earlier revision named it `citation_recall` here, which never matched any result key.
citation:
  citation_correctness:
    minimum: 0.65
    tolerance: 0.05   # Citations must be very reliable

  citation_completeness:
    minimum: 0.55
    tolerance: 0.10

  grounded_answer_rate:
    minimum: 0.70
    tolerance: 0.10

  refusal_correctness:
    minimum: 0.75
    tolerance: 0.10

  # Lower is better; guarded by the absolute minimum only.
  unsupported_claim_rate:
    minimum: 0.00
    tolerance: 0.00

# Per-difficulty thresholds (same metric names, applied to easy/medium/hard splits).
# Floors reflect the hard split, which is the weakest split and therefore binding.
per_difficulty:
  recall_at_k:
    minimum: 0.35
    tolerance: 0.10

  hit_rate:
    minimum: 0.45
    tolerance: 0.10

  citation_correctness:
    minimum: 0.55
    tolerance: 0.05
