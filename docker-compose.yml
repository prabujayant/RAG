# AskMyDocs infrastructure: PostgreSQL (metadata + tsvector keyword search),
# Qdrant (vectors), Redis (Celery). OpenSearch was removed — keyword search
# now lives in Postgres (keyword_postings). The FastAPI app may run locally
# or via a separate image.
#
# Start dependencies:   docker compose up -d
# Stop / reset:         docker compose down -v

services:
  redis:
    image: redis:7-alpine
    container_name: askmydocs-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: askmydocs-postgres
    environment:
      POSTGRES_USER: askmydocs
      POSTGRES_PASSWORD: askmydocs
      POSTGRES_DB: askmydocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmydocs -d askmydocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: askmydocs-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  postgres_data:
  qdrant_data:
